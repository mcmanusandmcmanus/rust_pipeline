[project]
name = "rust-pipeline-modeling"
version = "0.1.0"
description = "Python side of the Rust ↔ XGBoost benchmark (training + plots)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "polars>=1.35.0",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.6.0",
    "xgboost>=3.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0"
]

[project.optional-dependencies]
tests = ["pytest", "ruff"]

[tool.rye]
managed = false

[tool.setuptools]
py-modules = []
